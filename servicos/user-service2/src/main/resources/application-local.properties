server.port=8802

# Configuracoes do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres-user-db:5432/user_service_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

# Configuracoes RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Chave interna para comunicacao segura entre servicos
api.internal.secret=MinhaChaveSecretaSuperSeguraParaTestesLocais123!

# ===============================================
# OBSERVABILIDADE E MONITORAMENTO
# ===============================================
management.endpoints.web.exposure.include=health,prometheus
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]