server.port=8805

# Configuracoes do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres-feedback-db:5432/feedback_service_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

# Configuracoes RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# URL do User Service para buscar dados de usuarios, se necessario
userservice.api.url=http://user-service:8802

# Chave interna para comunicacao segura entre servicos
api.internal.secret=MinhaChaveSecretaSuperSeguraParaTestesLocais123!

# ===============================================
# OBSERVABILIDADE E MONITORAMENTO
# ===============================================
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# CONFIGURACAO DE SEGURANCA PARA O ACTUATOR (PARA PROMETHEUS)
# Permite acesso publico ao endpoint /actuator/prometheus para coleta de metricas
spring.security.web.publish-digest-only=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans