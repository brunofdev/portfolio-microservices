services:
  # ===============================================
  # INFRAESTRUTURA
  # ===============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user-db:
    image: postgres:15
    container_name: postgres-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-feedback-db:
    image: postgres:15
    container_name: postgres-feedback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: feedback_service_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d feedback_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================================
  # TORRE DE MONITORAMENTO (NOVO)
  # ===============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Aponta para o novo arquivo de configuracao
      - ./monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  # ===============================================
  # MICROSSERVICOS (com depends_on atualizado)
  # ===============================================
  user-service:
    build: ./user-service2
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8802:8802"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_RABBITMQ_VIRTUAL_HOST=/
    depends_on:
      postgres-user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started # Espera o Zipkin iniciar

  auth-service:
    # ... (igual a antes, mas adicione depends_on para zipkin)
    build: ./authservice
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8803:8803"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      - user-service
      - zipkin

  processador-feedbacks:
    # ... (igual a antes, mas adicione depends_on para zipkin)
    build: ./processadorfeedbacks
    container_name: processador-feedbacks
    restart: unless-stopped
    ports:
      - "8804:8804"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      # ... (configuracao do rabbitmq) ...
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started

  feedback-service:
    # ... (igual a antes, mas adicione depends_on para zipkin)
    build: ./feedbackservice
    container_name: feedback-service
    restart: unless-stopped
    ports:
      - "8805:8805"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      # ... (configuracao do rabbitmq) ...
    depends_on:
      postgres-feedback-db:
        condition: service_healthy
      user-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started

  mailservice:
    # ... (igual a antes, mas adicione depends_on para zipkin)
    build: ./mailservice
    container_name: mailservice
    restart: unless-stopped
    ports:
      - "8806:8806"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      # ... (configuracao do rabbitmq) ...
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started

  api-gateway:
    # ... (igual a antes, mas adicione depends_on para zipkin)
    build: ./apigateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      - auth-service
      - user-service
      - feedback-service
      - processador-feedbacks
      - zipkin